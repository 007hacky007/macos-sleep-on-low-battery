name: BatterySleepGuard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  BatterySleepGuard:
    type: application
    platform: macOS
    sources:
      - path: BatterySleepGuard
    info:
      path: BatterySleepGuard/Info.plist
      properties:
        CFBundleDisplayName: Battery Sleep Guard
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    entitlements:
      path: BatterySleepGuard/BatterySleepGuard.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_NAME: BatterySleepGuard
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BatterySleepGuard
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  BatterySleepGuardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BatterySleepGuardTests
    dependencies:
      - target: BatterySleepGuard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BatterySleepGuardTests
schemes:
  BatterySleepGuard:
    build:
      targets:
        BatterySleepGuard: all
        BatterySleepGuardTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BatterySleepGuardTests
    archive:
      config: Release
